name: PR 1107 Windows x64 test build

on:
  push:
    branches: [codex/build-pr-1107-30aa7a0d]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    environment: desktop-release
    timeout-minutes: 60
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_DESKTOP_LOCAL_PROPERTIES_BASE64 }}
      SENTRY_DESKTOP_DSN: ${{ secrets.SENTRY_DESKTOP_DSN }}
    steps:
      - name: Check out exact PR source
        shell: bash
        run: |
          git init .
          git remote add origin https://github.com/NuvioMedia/NuvioDesktop.git
          git fetch --depth=1 origin 30aa7a0d02dcddda7d6a9a11a77b774bfc247dd6
          git checkout --detach 30aa7a0d02dcddda7d6a9a11a77b774bfc247dd6
      - name: Fetch Windows player runtime
        shell: bash
        run: |
          git lfs pull --include="composeApp/src/desktopMain/native/windows/runtime/**" --exclude=""
          test "$(wc -c < composeApp/src/desktopMain/native/windows/runtime/libmpv-2.dll)" -gt 1000000
          test "$(git rev-parse HEAD)" = 30aa7a0d02dcddda7d6a9a11a77b774bfc247dd6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Configure desktop runtime
        shell: bash
        run: |
          test -n "$LOCAL_PROPERTIES_BASE64" || { echo 'The desktop-release environment is missing NUVIO_DESKTOP_LOCAL_PROPERTIES_BASE64.' >&2; exit 1; }
          printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_(STORE_FILE|STORE_PASSWORD|KEY_ALIAS|KEY_PASSWORD)|NUVIO_MACOS_(SIGNING_IDENTITY|NOTARY_APPLE_ID|NOTARY_TEAM_ID|NOTARY_PASSWORD|NOTARY_KEYCHAIN_PROFILE|NOTARY_KEYCHAIN_PATH))[[:space:]]*=/d' local.properties
      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.4078.44 -OutputDirectory "$env:RUNNER_TEMP\nuget" -DirectDownload -NonInteractive -NoCache
          "WEBVIEW2_ROOT=$env:RUNNER_TEMP\nuget\Microsoft.Web.WebView2.1.0.4078.44" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Test Windows touchscreen handling
        shell: pwsh
        run: |
          & .\gradlew.bat :composeApp:desktopTest --tests com.nuvio.app.WindowsTouchRootsTest --tests com.nuvio.app.WindowsTouchScrollTest --no-configuration-cache --console=plain --max-workers=2 "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" "-Pkotlin.daemon.jvmargs=-Xmx2g"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows MSI
        shell: pwsh
        run: |
          & .\gradlew.bat :composeApp:packageReleaseMsi "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT" -Pcompose.desktop.packaging.checkJdkVendor=false --no-configuration-cache --console=plain --max-workers=2 "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" "-Pkotlin.daemon.jvmargs=-Xmx2g"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record source and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifact -Force | Out-Null
          $msis = @(Get-ChildItem composeApp/build/compose/release-msis/*.msi)
          if ($msis.Count -ne 1) { throw 'Expected exactly one MSI' }
          Copy-Item $msis[0].FullName artifact/Nuvio-PR1107-Windows-x64-30aa7a0d.msi
          @('Source: https://github.com/NuvioMedia/NuvioDesktop/pull/1107', 'Commit: 30aa7a0d02dcddda7d6a9a11a77b774bfc247dd6', 'Unsigned test build using the fork desktop-release environment configuration.') | Set-Content artifact/BUILD.txt
          Get-FileHash artifact/*.msi -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))" } | Set-Content artifact/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: Nuvio-PR1107-Windows-x64-30aa7a0d
          path: artifact/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: PR1107-test-results
          path: |
            composeApp/build/reports/tests/desktopTest/**
            composeApp/build/test-results/desktopTest/**
          if-no-files-found: ignore
          retention-days: 14
